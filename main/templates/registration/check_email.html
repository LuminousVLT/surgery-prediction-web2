{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยืนยันอีเมลของคุณ | Surgery Predictor</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-bg">
    <div class="auth-card" style="text-align: center;">
        <i class="fa-solid fa-envelope-circle-check" style="font-size: 3.5rem; color: #007bff; margin-bottom: 1.5rem;"></i>
        <h2 style="color: #333;">สมัครสมาชิกสำเร็จ!</h2>
        <p class="text-muted">เราได้ส่งลิงก์ยืนยันตัวตนไปที่อีเมลของคุณแล้ว กรุณากดลิงก์ในอีเมลเพื่อเปิดใช้งานบัญชีของคุณก่อนเข้าสู่ระบบ</p>
        
        <div class="alert alert-info" style="font-size: 0.85rem; background: #e7f3ff; border: 1px solid #b8daff; padding: 10px; border-radius: 8px; margin-top: 20px;">
            <i class="fa-solid fa-circle-info"></i> หากไม่พบอีเมล กรุณาตรวจสอบในโฟลเดอร์ <strong>Junk Mail / Spam</strong>
        </div>

        <div class="auth-footer" style="margin-top: 30px;">
            <a href="{% url 'login' %}" style="color: #007bff; text-decoration: none; font-weight: bold;">ไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

</html>
