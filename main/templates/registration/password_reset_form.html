{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ลืมรหัสผ่าน | Surgery Predictor</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <i class="fa-solid fa-key" style="font-size: 3.5rem; color: #ffc107;"></i>
            <h2 style="margin-top: 10px; color: #333;">ลืมรหัสผ่าน?</h2>
            <p class="text-muted" style="font-size: 0.9rem;">กรอกอีเมลที่คุณใช้สมัครสมาชิก เพื่อรับลิงก์สำหรับรีเซ็ตรหัสผ่าน</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>อีเมล (Email)</label>
                <input type="email" name="email" class="form-control" required placeholder="ระบุอีเมลของคุณ">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                ส่งลิงก์รีเซ็ตรหัสผ่าน
            </button>
        </form>

        <div class="auth-footer" style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            <a href="{% url 'login' %}" style="color: #666; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>
</body>
</html>
